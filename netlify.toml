[build]
  # Deploys the Convex functions to production, then builds the site with
  # VITE_CONVEX_URL pointing at that deployment. Requires the CONVEX_DEPLOY_KEY
  # environment variable in Netlify (Convex dashboard → Settings → General →
  # Production deploy key).
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

# Pull request previews only check that the site builds. They must not deploy
# the Convex functions: the only deploy key in Netlify is the production one,
# and Convex refuses to use it outside a production build. The preview site has
# no backend unless VITE_CONVEX_URL is set in Netlify for deploy previews.
[context.deploy-preview]
  command = "npm run build"

# Single-page app: let React Router handle every path (e.g. /entregas/123).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must be re-checked on every visit so phones
# pick up new versions of the app quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
